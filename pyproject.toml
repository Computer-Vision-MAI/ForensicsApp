[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forensics-app"
version = "0.1.0"
description = "Extensible Tkinter starter for an MSc Computer Vision course"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0,<13", "numpy>=1.26", "matplotlib>=3.8", "scikit-image>=0.21.0", "scipy>=1.11", "scikit-learn>=1.4"]

[project.optional-dependencies]
# Set 7 bonus (BoW vs CNN). Install the CPU build with requirements-cnn.txt:
# the default PyPI build of torch for Linux bundles CUDA and weighs several GB.
cnn = ["torch>=2.2", "torchvision>=0.17"]

[tool.setuptools.packages.find]
include = ["forensics_app*"]
